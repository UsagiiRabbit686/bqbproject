<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比奇堡小区二期入驻申请 - 首页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        /* 全局像素风格（与之前一致，可共用） */
        :root {
            --pixel-black: #1a1a1a;
            --pixel-dark: #2d2d2d;
            --pixel-gray: #6b6b6b;
            --pixel-light: #d4d4d4;
            --pixel-white: #f5f5f5;
            --pixel-blue: #4a90d9;
            --pixel-blue-dark: #2d5a8f;
            --pixel-green: #5cb85c;
            --pixel-green-dark: #3d7a3d;
            --pixel-red: #e05a5a;
            --pixel-red-dark: #a03d3d;
            --pixel-yellow: #f0c040;
            --pixel-yellow-dark: #b8942f;
            --pixel-orange: #e8823a;
            --pixel-teal: #4aa3a3;
            --pixel-purple: #7a5ab8;
            --pixel-bg-dark: #1a2a3a;
            --pixel-border: 3px solid #1a1a1a;
            --pixel-shadow: 5px 5px 0 rgba(0, 0, 0, 0.35);
            --pixel-shadow-sm: 3px 3px 0 rgba(0, 0, 0, 0.3);
            --font-pixel-en: 'Press Start 2P', 'DotGothic16', monospace;
            --font-pixel-zh: 'DotGothic16', 'Press Start 2P', 'Zpix', 'SimSun', monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:16px; scroll-behavior:smooth; }
        body {
            font-family: var(--font-pixel-zh);
            background: var(--pixel-bg-dark);
            color: var(--pixel-white);
            min-height:100vh;
            overflow-x:hidden;
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
            text-rendering: optimizeSpeed;
            cursor: default;
            user-select: none;
        }
        ::-webkit-scrollbar { width:14px; height:14px; }
        ::-webkit-scrollbar-track { background:#1a1a1a; border:2px solid #000; }
        ::-webkit-scrollbar-thumb { background:#6b6b6b; border:2px solid #000; box-shadow: inset 0 0 0 2px #3a3a3a; }

        /* 首页专用样式 */
        #page-home {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }
        .slideshow-bg { position:absolute; inset:0; z-index:0; overflow:hidden; }
        .slideshow-bg .slide {
            position:absolute; inset:0; background-size:cover; background-position:center;
            opacity:0; transition: opacity 1.2s ease-in-out; z-index:1; image-rendering: pixelated;
            filter: brightness(0.55) saturate(0.9);
        }
        .slideshow-bg .slide.active { opacity:1; z-index:2; }
        .slide-1 { background-image: linear-gradient(135deg, #0d1b2a 0%, #1b3a4b 30%, #2d5f7e 60%, #1a2a3a 100%); }
        .slide-2 { background-image: linear-gradient(135deg, #1a0d0d 0%, #3d1f1f 30%, #7e3d2d 60%, #2a1a1a 100%); }
        .slide-3 { background-image: linear-gradient(135deg, #0d1a0d 0%, #1f3d1f 30%, #2d7e4a 60%, #1a2a1a 100%); }
        .slide-4 { background-image: linear-gradient(135deg, #1a0d2a 0%, #3d1f5f 30%, #7e2d6b 60%, #2a1a3a 100%); }
        .scanline-overlay {
            position:absolute; inset:0; z-index:3; pointer-events:none;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px);
            animation: scanline 0.4s linear infinite;
        }
        .pixel-grid-overlay {
            position:absolute; inset:0; z-index:2; pointer-events:none;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size:32px 32px;
        }
        @keyframes scanline { 0%{background-position:0 0;} 100%{background-position:0 8px;} }
        @keyframes floatPixel { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
        .home-content { position:relative; z-index:10; text-align:center; padding:2rem; max-width:900px; width:90%; }
        .home-badge {
            display:inline-block; background:var(--pixel-yellow); color:var(--pixel-black);
            padding:0.6rem 1.5rem; font-size:0.8rem; font-family:var(--font-pixel-en); letter-spacing:2px;
            border:3px solid #1a1a1a; box-shadow:var(--pixel-shadow-sm); margin-bottom:1.8rem; text-transform:uppercase;
            animation:floatPixel 3s ease-in-out infinite;
        }
        .home-title {
            font-family:var(--font-pixel-zh); font-size:clamp(1.8rem,5vw,3.8rem); font-weight:900; color:#fff;
            letter-spacing:3px; line-height:1.3; margin-bottom:1rem;
            background:linear-gradient(180deg,#ffd700 0%,#ffaa00 40%,#ffdd55 70%,#ffaa00 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; filter:drop-shadow(3px 3px 0 #1a1a1a);
        }
        .home-subtitle { font-size:1rem; color:#ccc; letter-spacing:2px; margin-bottom:2.5rem; text-shadow:2px 2px 0 #000; font-family:var(--font-pixel-zh); opacity:0.85; }
        .pixel-btn {
            display:inline-block; font-family:var(--font-pixel-zh); font-size:1.1rem; font-weight:bold; letter-spacing:2px; text-transform:uppercase;
            cursor:pointer; border:3px solid #1a1a1a; box-shadow:var(--pixel-shadow); padding:1rem 2.5rem;
            background:var(--pixel-green); color:#fff; text-shadow:2px 2px 0 #1a1a1a; transition:all 0.12s steps(2); image-rendering:pixelated;
            position:relative; text-decoration:none; outline:none; -webkit-tap-highlight-color:transparent;
        }
        .pixel-btn:hover { background:var(--pixel-green-dark); box-shadow:3px 3px 0 rgba(0,0,0,0.35); transform:translate(2px,2px); }
        .pixel-btn:active { box-shadow:1px 1px 0 rgba(0,0,0,0.35); transform:translate(4px,4px); }
        .btn-yellow { background:var(--pixel-yellow); color:#1a1a1a; text-shadow:none; }
        .btn-yellow:hover { background:var(--pixel-yellow-dark); color:#fff; }
        .home-admin-link {
            position:absolute; bottom:1.5rem; right:1.5rem; z-index:20; font-size:0.7rem; color:#aaa; text-decoration:none;
            background:rgba(0,0,0,0.5); padding:0.5rem 1rem; border:2px solid #555; cursor:pointer; letter-spacing:1px; transition:all 0.15s; font-family:var(--font-pixel-en);
        }
        .home-admin-link:hover { color:#fff; border-color:#fff; background:rgba(0,0,0,0.7); }
        .slide-dots { position:absolute; bottom:2rem; left:50%; transform:translateX(-50%); z-index:15; display:flex; gap:0.8rem; }
        .slide-dot { width:12px; height:12px; border:2px solid #fff; background:transparent; cursor:pointer; transition:background 0.2s; image-rendering:pixelated; }
        .slide-dot.active { background:#fff; }
        .slide-dot:hover { background:rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <div id="page-home">
        <div class="slideshow-bg" id="slideshowBg">
            <div class="slide slide-1 active" data-slide="0"></div>
            <div class="slide slide-2" data-slide="1"></div>
            <div class="slide slide-3" data-slide="2"></div>
            <div class="slide slide-4" data-slide="3"></div>
        </div>
        <div class="pixel-grid-overlay"></div>
        <div class="scanline-overlay"></div>

        <div class="home-content">
            <div class="home-badge">BQB Community</div>
            <h1 class="home-title">比奇堡小区二期入驻中心</h1>
            <p class="home-subtitle">—— 欢~~迎回家！ ——</p>
            <a href="form.html" class="pixel-btn btn-yellow">▶ 点击报名</a>
        </div>

        <div class="slide-dots" id="slideDots">
            <span class="slide-dot active" data-index="0" onclick="goToSlide(0)"></span>
            <span class="slide-dot" data-index="1" onclick="goToSlide(1)"></span>
            <span class="slide-dot" data-index="2" onclick="goToSlide(2)"></span>
            <span class="slide-dot" data-index="3" onclick="goToSlide(3)"></span>
        </div>

        <a class="home-admin-link" href="admin.html">⚙ 管理员入口</a>
    </div>

    <script>
        (function() {
            // 用户可替换的背景图片数组，支持CSS渐变或url()
            const slideshowImages = [
                'url(bg1.png)',
                'url(bg2.png)',
                'url(bg3.png)',
                'url(bg4.png)'
            ];
            let currentSlide = 0;
            let slideInterval;

            function applySlideBackgrounds() {
                const slides = document.querySelectorAll('.slideshow-bg .slide');
                slides.forEach((slide, index) => {
                    if (index < slideshowImages.length) {
                        slide.style.backgroundImage = slideshowImages[index];
                    }
                });
                const dotsContainer = document.getElementById('slideDots');
                dotsContainer.innerHTML = '';
                slideshowImages.forEach((_, index) => {
                    const dot = document.createElement('span');
                    dot.className = 'slide-dot' + (index === currentSlide ? ' active' : '');
                    dot.setAttribute('data-index', index);
                    dot.onclick = function() { goToSlide(index); };
                    dotsContainer.appendChild(dot);
                });
            }

            function goToSlide(index) {
                const slides = document.querySelectorAll('.slideshow-bg .slide');
                if (slides.length === 0) return;
                currentSlide = ((index % slides.length) + slides.length) % slides.length;
                slides.forEach((slide, i) => {
                    slide.classList.toggle('active', i === currentSlide);
                });
                document.querySelectorAll('.slide-dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentSlide);
                });
                resetSlideTimer();
            }
            window.goToSlide = goToSlide;

            function resetSlideTimer() {
                if (slideInterval) clearInterval(slideInterval);
                slideInterval = setInterval(() => {
                    const slides = document.querySelectorAll('.slideshow-bg .slide');
                    if (slides.length === 0) return;
                    currentSlide = (currentSlide + 1) % slides.length;
                    slides.forEach((slide, i) => {
                        slide.classList.toggle('active', i === currentSlide);
                    });
                    document.querySelectorAll('.slide-dot').forEach((dot, i) => {
                        dot.classList.toggle('active', i === currentSlide);
                    });
                }, 5000);
            }

            applySlideBackgrounds();
            resetSlideTimer();
        })();
    </script>
</body>
</html>
